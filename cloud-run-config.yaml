apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orbitex-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/nice-azimuth-310713/orbitex-frontend:20251211-021454
        ports:
        - containerPort: 3000
        env:
        # Next.js Configuration
        - name: NODE_ENV
          value: "production"
        
        # API Configuration
        - name: NEXT_PUBLIC_API_URL
          value: "https://orbitex-976099405307.us-central1.run.app"
        - name: NEXT_PUBLIC_AUTH_SERVICE_URL
          value: "https://orbisigner-976099405307.us-central1.run.app/api/v2/identity"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://socketeer-976099405307.us-central1.run.app/public"
        
        # Frontend URLs
        - name: NEXT_PUBLIC_FRONTEND_URL
          value: "https://orbitex-frontend-976099405307.us-central1.run.app"
        
        # Feature Flags
        - name: NEXT_PUBLIC_ENABLE_2FA
          value: "false"
        - name: NEXT_PUBLIC_ENABLE_KYC
          value: "false"
        - name: NEXT_PUBLIC_ENABLE_WEBAUTHN
          value: "false"
        
        # Skip environment validation in production
        - name: SKIP_ENV_VALIDATION
          value: "true"
        
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "1"
            memory: "1Gi"
